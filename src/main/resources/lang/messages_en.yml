schema-version: 1
prefix: "&#9863E7⏵ DuskContracts &8| "
error.no-permission: '<red>You do not have permission to do that.'
error.players-only: '<red>This command can only be used by a player.'
error.not-found: '<red>Contract <white>{contract_id}</white> was not found or is not visible to you.'
error.changed: '<yellow>This contract changed while you had it open. Review the remaining amount before confirming.'
error.generic: '<red>The operation could not be completed. Reference: <white>{correlation_id}</white>.'
error.recovery: '<yellow>Your delivery is safely quarantined and was not paid or returned automatically. Ask an administrator to review reference <white>{correlation_id}</white>.'
error.rate-limit: '<yellow>Please slow down before trying again.'
error.invalid-item: '<red>One or more items do not match this contract.'
error.money-unavailable: '<yellow>Money contracts are disabled because Vault and an economy provider are not available.'
menu.help: '<gold>/contract</gold> opens the menu. Use <white>browse</white>, <white>create</white>, <white>mine</white>, <white>active</white> or <white>claim</white>. Delivery and assassination rewards use protected escrow.'
contract.created: '<green>Contract <white>{contract_id}</white> was funded and published.'
contract.cancelled: '<yellow>Contract <white>{contract_id}</white> was cancelled. Unused escrow was added to your claims.'
contract.delivered: '<green>Your delivery to <white>{contract_id}</white> was committed. Check your claims for the reward.'
contract.none: '<gray>No contracts were found.'
claim.none: '<gray>You have no pending claims.'
assassination.completed: '<green>You completed {contracts} assassination contract(s) against <white>{target}</white>. The reward is in Claims.'
assassination.started: '<green>You started contract <white>{contract_id}</white>. Target: <white>{target}</white>.'
assassination.start-failed: '<red>The assassination contract could not be started: {reason}'
claim.success: '<green>Claim delivered safely.'
claim.failed: '<yellow>The claim remains pending: {reason}'
wizard.start: '<gold>Creation started.</gold> The requested item is the item in your main hand. Type the total quantity, or <white>cancel</white>.'
wizard.request-item: '<yellow>Hold the item you want to request in your main hand, then click Create again.'
wizard.match: '<gold>Matching:</gold> type MATERIAL, SIMILAR, or EXACT. MATERIAL checks type only; SIMILAR checks normal metadata; EXACT checks the stable serialized item data.'
wizard.fulfillment: '<gold>Fulfillment:</gold> type COMPLETE or PROPORTIONAL.'
wizard.reward: '<gold>Reward:</gold> type MONEY 5000.00, or ITEM to use the complete stack in your off hand.'
wizard.duration: '<gold>Duration:</gold> type one of {durations}.'
wizard.target: '<gold>Visibility:</gold> type PUBLIC, or the exact online player name for a directed contract.'
wizard.review: '<gold>Review:</gold> {total} × {requested_item}, {reward}, expires in {duration}, {visibility}. Type CONFIRM to fund it or CANCEL.'
wizard.cancelled: '<yellow>Contract creation was cancelled.'
wizard.expired: '<yellow>Your contract creation session expired.'
wizard.cooldown: '<yellow>Please wait before starting another contract.'
wizard.limit: '<yellow>You already have the maximum of {limit} active contracts.'
wizard.invalid: '<red>That value is not valid. {reason}'
wizard.create-failed: '<red>The contract could not be created: {reason} <gray>(reference {correlation_id})'
wizard.input.material: '<yellow>Type the material name in chat, for example <white>DIAMOND</white>. Type <white>cancel</white> to return.'
wizard.input.amount: '<yellow>Type the total requested quantity in chat. Type <white>cancel</white> to return.'
wizard.input.reward: '<yellow>Type the money reward in chat, for example <white>5000.00</white>. Type <white>cancel</white> to return.'
wizard.input.target: '<yellow>Type the exact name of an online player in chat. Type <white>cancel</white> to return.'
wizard.input.assassination-target: '<yellow>Type the nickname of a player who has joined this server. You may select yourself. Type <white>cancel</white> to return.'
wizard.updated: '<green>Contract configuration updated.'
wizard.reward-item-selected: '<green>The complete stack in your off hand is now the item reward.'
wizard.reward-items-empty: '<yellow>Deposit at least one item stack before saving the reward.'
wizard.reward-items-selected: '<green>Reward saved: <white>{summary}</white>.'
admin.reload-ok: '<green>Configuration and messages reloaded.'
admin.reload-failed: '<red>Reload failed: {reason}'
admin.confirm: '<yellow>Dangerous action ready. Run <white>/contracts admin confirm {token}</white> within 60 seconds.'
admin.done: '<green>Administrative action completed and audited.'
notifications.changed: '<green>Contract notifications are now {state}.'
contract.info: '<gold>#{contract_id}</gold> <white>{material}</white> — {delivered}/{total}, status {status}, creator {creator}, reward {reward}.'
admin.operation: '<gray>{operation_id}</gray> <white>{type}</white> — {state}; correlation {correlation_id}; evidence: {evidence}'
admin.stats: '<gold>Open:</gold> {open} <gold>Pending claims:</gold> {claims} <gold>Ambiguous:</gold> {ambiguous}'
admin.initializing: '<yellow>DuskContracts is still initializing storage. Try again in a moment.'
admin.doctor: '<gold>DuskContracts doctor</gold><newline><gray>Plugin:</gray> {plugin}<newline><gray>Server:</gray> {server}<newline><gray>Java:</gray> {java}<newline><gray>Scheduler:</gray> {scheduler}<newline><gray>Storage:</gray> {storage}<newline><gray>Economy:</gray> {economy}<newline><gray>Open:</gray> {open} <gray>Claims:</gray> {claims} <gray>Ambiguous:</gray> {ambiguous}<newline><gray>Schema:</gray> {schema} <gray>DB latency:</gray> {latency}ms'
