schema-version: 1
prefix: "&#9863E7⏵ DuskContracts &8| "
error.no-permission: '<red>No tienes permiso para hacer eso.'
error.players-only: '<red>Solo un jugador puede usar este comando.'
error.not-found: '<red>No se encontró el contrato <white>{contract_id}</white> o no puedes verlo.'
error.changed: '<yellow>Este contrato cambió mientras lo tenías abierto. Revisa la cantidad restante antes de confirmar.'
error.generic: '<red>No se pudo completar la operación. Referencia: <white>{correlation_id}</white>.'
error.recovery: '<yellow>Tu entrega quedó en cuarentena segura y no se pagó ni devolvió automáticamente. Pide a un administrador revisar la referencia <white>{correlation_id}</white>.'
error.rate-limit: '<yellow>Espera un momento antes de intentarlo otra vez.'
error.invalid-item: '<red>Uno o más objetos no corresponden a este contrato.'
error.money-unavailable: '<yellow>Los contratos de dinero están desactivados porque Vault y un proveedor de economía no están disponibles.'
menu.help: '<gold>/contract</gold> abre el menú. Usa <white>browse</white>, <white>create</white>, <white>mine</white>, <white>active</white> o <white>claim</white>. Las recompensas de entrega y asesinato usan escrow protegido.'
contract.created: '<green>El contrato <white>{contract_id}</white> fue financiado y publicado.'
contract.cancelled: '<yellow>El contrato <white>{contract_id}</white> fue cancelado. El escrow no usado está en tus reclamaciones.'
contract.delivered: '<green>Tu entrega a <white>{contract_id}</white> quedó confirmada. Revisa tus reclamaciones para cobrar.'
contract.none: '<gray>No se encontraron contratos.'
claim.none: '<gray>No tienes reclamaciones pendientes.'
assassination.completed: '<green>Completaste {contracts} contrato(s) de asesinato contra <white>{target}</white>. La recompensa está en Reclamaciones.'
assassination.started: '<green>Iniciaste el contrato <white>{contract_id}</white>. Objetivo: <white>{target}</white>.'
assassination.start-failed: '<red>No se pudo iniciar el contrato de asesinato: {reason}'
claim.success: '<green>La reclamación se entregó de forma segura.'
claim.failed: '<yellow>La reclamación sigue pendiente: {reason}'
wizard.start: '<gold>Creación iniciada.</gold> El objeto solicitado es el de tu mano principal. Escribe la cantidad total o <white>cancel</white>.'
wizard.request-item: '<yellow>Sostén en la mano principal el objeto que quieres solicitar y vuelve a pulsar Crear.'
wizard.match: '<gold>Comparación:</gold> escribe MATERIAL, SIMILAR o EXACT. MATERIAL solo revisa el tipo; SIMILAR revisa metadatos normales; EXACT revisa los datos serializados estables.'
wizard.fulfillment: '<gold>Cumplimiento:</gold> escribe COMPLETE o PROPORTIONAL.'
wizard.reward: '<gold>Recompensa:</gold> escribe MONEY 5000.00, o ITEM para usar toda la pila de tu mano secundaria.'
wizard.duration: '<gold>Duración:</gold> escribe una de estas opciones: {durations}.'
wizard.target: '<gold>Visibilidad:</gold> escribe PUBLIC o el nombre exacto de un jugador conectado para dirigirlo.'
wizard.review: '<gold>Revisión:</gold> {total} × {requested_item}, {reward}, vence en {duration}, {visibility}. Escribe CONFIRM para financiarlo o CANCEL.'
wizard.cancelled: '<yellow>Se canceló la creación del contrato.'
wizard.expired: '<yellow>Tu sesión de creación expiró.'
wizard.cooldown: '<yellow>Espera antes de iniciar otro contrato.'
wizard.limit: '<yellow>Ya tienes el máximo de {limit} contratos activos.'
wizard.invalid: '<red>Ese valor no es válido. {reason}'
wizard.create-failed: '<red>No se pudo crear el contrato: {reason} <gray>(referencia {correlation_id})'
wizard.input.material: '<yellow>Escribe el nombre del material en el chat, por ejemplo <white>DIAMOND</white>. Escribe <white>cancel</white> para volver.'
wizard.input.amount: '<yellow>Escribe en el chat la cantidad total solicitada. Escribe <white>cancel</white> para volver.'
wizard.input.reward: '<yellow>Escribe en el chat la recompensa de dinero, por ejemplo <white>5000.00</white>. Escribe <white>cancel</white> para volver.'
wizard.input.target: '<yellow>Escribe en el chat el nombre exacto de un jugador conectado. Escribe <white>cancel</white> para volver.'
wizard.input.assassination-target: '<yellow>Escribe el nick de un jugador que haya entrado al servidor. Puedes elegirte a ti mismo. Escribe <white>cancel</white> para volver.'
wizard.updated: '<green>Se actualizó la configuración del contrato.'
wizard.reward-item-selected: '<green>La pila completa de tu mano secundaria será la recompensa de objetos.'
wizard.reward-items-empty: '<yellow>Deposita al menos una pila de objetos antes de guardar la recompensa.'
wizard.reward-items-selected: '<green>Recompensa guardada: <white>{summary}</white>.'
admin.reload-ok: '<green>La configuración y los mensajes se recargaron.'
